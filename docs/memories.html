<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEMORIES</title><style>body{margin:0;background:#080706;color:#32281e;font:15px Georgia}.wrap{width:min(900px,94vw);margin:auto;padding:30px 0}.book{background:#3a291b;padding:20px;border-radius:15px}.paper{background:#eee1c5;padding:30px;border-radius:5px;min-height:500px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.day{padding:18px;background:#fff5;border:1px solid #765;border-radius:12px;text-align:left;cursor:pointer}.locked{opacity:.45}.msg{margin-top:20px;padding:20px;background:#fff8;border-left:3px solid #8d2332}@media(max-width:650px){.grid{grid-template-columns:1fr}.paper{min-height:420px;padding:20px}}</style></head><body><main class="wrap"><a href="index.html" style="color:#fff">← HOME</a><div class="book"><div class="paper"><h1>MEMORIES</h1><p>Some messages are meant to wait.</p><div class="grid" id="days"></div><div id="msg"></div></div></div></main><script src="site-engine.js"></script><script src="memories.js"></script><script>function render(){days.innerHTML='';MemoriesSystem.all().forEach(m=>{const b=document.createElement('button');b.className='day '+(m.available?'':'locked');b.disabled=!m.available;b.innerHTML=`<b>${m.date}</b><br>${m.available?'🔓 OPEN':'🔒 WAIT'}`;b.onclick=()=>{const x=MemoriesSystem.open(m.id);if(x){msg.innerHTML=`<div class="msg"><small>${x.date}</small><h2>${x.title}</h2><p>${x.text}</p></div>`;render()}};days.appendChild(b)})}render();</script></body></html>
