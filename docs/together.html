<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OUR TIME TOGETHER</title><style>body{margin:0;background:#020308;color:#fff;font:15px Arial;overflow:hidden}.world{min-height:100vh;display:grid;place-items:center;padding:16px}.panel{width:min(800px,94vw);text-align:center;padding:30px;border:1px solid #fff2;border-radius:25px;background:#0008;position:relative;z-index:2}h1{font-size:clamp(35px,8vw,70px);font-weight:200}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.unit{padding:18px;border:1px solid #fff1;border-radius:15px}.num{font-size:clamp(28px,6vw,52px);display:block}.label{font-size:10px;color:#aaa;letter-spacing:.2em}canvas{position:fixed;inset:0;width:100%;height:100%}.back{color:#aaa}@media(max-width:550px){.timer{grid-template-columns:repeat(2,1fr)}} </style></head><body><canvas id="c"></canvas><main class="world"><section class="panel"><a class="back" href="story.html">← STORY</a><h1>OUR TIME TOGETHER</h1><p>Two paths crossed. And they kept going.</p><div class="timer"><div class="unit"><span class="num" data-days>00</span><span class="label">DAYS</span></div><div class="unit"><span class="num" data-hours>00</span><span class="label">HOURS</span></div><div class="unit"><span class="num" data-minutes>00</span><span class="label">MINUTES</span></div><div class="unit"><span class="num" data-seconds>00</span><span class="label">SECONDS</span></div></div><p style="color:#aaa">Since 31 August 2026 · and still counting ❤️</p></section></main><script src="site-engine.js"></script><script src="living-story.js"></script><script src="together.js"></script><script>const ctx=c.getContext('2d');let W,H,t=0;function size(){W=c.width=innerWidth;H=c.height=innerHeight;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',size);size();function draw(){t+=.008;ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2;['rgba(255,100,185,.75)','rgba(90,145,255,.75)'].forEach((col,k)=>{ctx.beginPath();for(let i=0;i<260;i++){const q=i/259,x=cx+(q-.5)*W*1.7,y=cy+Math.sin(q*7+t*(k?-.8:.8))*90+Math.sin(q*17-t)*22+(k?1:-1)*q*35;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.stroke()});requestAnimationFrame(draw)}draw();TogetherWorld.startTimer(document.querySelector('.panel'));</script></body></html>
