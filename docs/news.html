<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS</title><style>body{margin:0;background:#05060a;color:#fff;font:15px Arial}.wrap{width:min(850px,92vw);margin:auto;padding:50px 0}.back{color:#fff}.item{margin:20px 0;padding:25px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:#ffffff05}.date{color:#ff8095;font-size:11px;letter-spacing:.2em}button{background:#82162b;color:#fff;border:1px solid #c43a55;padding:10px 15px;border-radius:10px}@media(max-width:600px){.wrap{padding:30px 0}}</style></head><body><main class="wrap"><a class="back" href="index.html">← HOME</a><h1>NEWS</h1><p>Everything that changes on the website becomes part of its history.</p><div id="list"></div></main><script src="site-engine.js"></script><script src="news.js"></script><script>NewsSystem.all().forEach(n=>{const d=document.createElement('article');d.className='item';d.innerHTML=`<div class="date">${n.date} · ${SiteEngine.load().readNews.includes(n.id)?'':'NEW'}</div><h2>${n.title}</h2><p>${n.text}</p><button>OPEN UPDATE</button>`;d.querySelector('button').onclick=()=>{NewsSystem.open(n.id);d.querySelector('.date').textContent=n.date+' · READ'};list.appendChild(d)});</script></body></html>
